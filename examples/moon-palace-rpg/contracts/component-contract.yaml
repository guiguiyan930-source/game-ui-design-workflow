schema_version: 1
project_id: "moon-palace-rpg"
source_screen_id: home
source_screen_status: approved
components:
  - id: home-background
    name: 首页背景
    category: background
    reusable: false
    transparent_background: false
    text_policy: none
    target_size: [1080, 1920]
    states: [default]
    style_dependencies:
      - visual.materials
      - visual.lighting
      - colors.background
    prompt: prompts/components/home-background.md
    output: assets/components/home-background-default-v1.png
  - id: primary-button
    name: 主按钮
    category: control
    reusable: true
    transparent_background: true
    text_policy: no-text
    target_size: [640, 192]
    states: [default, pressed, disabled]
    style_dependencies:
      - colors.primary
      - geometry.radius
      - geometry.stroke
      - effects.shadow
    prompt: prompts/components/primary-button.md
    output: assets/components/primary-button-default-v1.svg
