name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate skills
        run: python scripts/validate_skills.py

      - name: Validate guofeng complete example
        run: python scripts/validate_project.py examples/guofeng-card-rpg --strict

      - name: Validate moon-palace example
        run: python scripts/validate_project.py examples/moon-palace-rpg --strict

      - name: Validate Factory v2 example
        run: python scripts/validate_project.py examples/factory-v2-shop --strict
